services:
  nginx:
    image: nginx:alpine
    container_name: ws
    ports:
      - ${WEB_SERVER_PORT}:80
      - ${WEB_SERVER_SECURE_PORT}:443
    volumes:
      - ./conf.d:/etc/nginx/conf.d
    networks:
      - proxy
    restart: unless-stopped
networks:
  proxy:
    name: proxy
    driver: bridge