server {
    listen 80;
    server_name ollama.api.home;

    location / {
        proxy_pass http://ollama:11434; # Nome do container da Web UI

        # 🔥 CRÍTICO pro streaming (Continue usa isso)
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 🔥 NÃO BUFFERIZAR (senão autocomplete quebra)
        proxy_buffering off;
        proxy_cache off;

        # 🔥 timeouts altos (LLM demora mesmo)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # headers padrão
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        chunked_transfer_encoding on;
    }
}