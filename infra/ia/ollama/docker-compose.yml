services:

  ollama:
    image: ollama/ollama:latest
    init: true
    container_name: ollama
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=1h
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1  
      - OLLAMA_NUM_THREAD=4 
    mem_limit: 4.5g
    cpus: 2.5
    shm_size: "1gb"
    ulimits:
      memlock: -1
    networks:
      - proxy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true        


  webui:
    # image: ghcr.io/open-webui/open-webui:main
    image: openwebui/open-webui:0.10
    container_name: open-webui
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_URL=http://ollama.web.home
    volumes:
      - ./data/webui:/app/backend/data
    restart: unless-stopped
    networks:
      - proxy
    depends_on:
      - ollama
    # mem_limit: 512m
    cpus: 0.5


networks:
  proxy:
    external: true