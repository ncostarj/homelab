services:
  n8n:
    image: n8nio/n8n:latest
    container_name: as
    ports:
      - ${N8N_PORT}:5678
    command: "start --tunnel"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin123
      # - N8N_HOST=localhost
      # - WEBHOOK_URL=https://n8n.localhost/
      # - N8N_EDITOR_BASE_URL=https://n8n.localhost/
      - N8N_PORT=${N8N_PORT}
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - N8N_SECURE_COOKIE=false
      - N8N_ENABLE_TUNNEL=true
    volumes:
      - ./data:/home/node/.n8n
    restart: unless-stopped
    networks:
      - proxy
networks:
  proxy:
    external: true