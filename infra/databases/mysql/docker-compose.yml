services:
  mysql:
    image: mysql:8
    container_name: rds
    ports:
      - ${RDS_SERVER_PORT}:3306    
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${RDS_SERVER_ROOT_PASSWORD}
      - MYSQL_DATABASE=${RDS_SERVER_DATABASE}
      - MYSQL_USER=${RDS_SERVER_USER}
      - MYSQL_PASSWORD=${RDS_SERVER_PASSWORD}
    volumes:
      - ./data:/var/lib/mysql
      - ./backups:/var/www/backups
    networks:
      - internal

# other common services

networks:
  internal:
    name: internal
    driver: bridge